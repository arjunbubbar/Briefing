name: Email Daily Briefing

on:
  push:
    paths:
      - 'briefings/*.html'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find newest briefing
        id: pick
        run: |
          file=$(ls -1 briefings/*.html | sort | tail -n 1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          date=$(basename "$file" .html)
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Daily Finance Briefing — ${{ steps.pick.outputs.date }}"
          to: arjunbubbar@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          html_body: file://${{ steps.pick.outputs.file }}
          convert_markdown: false
